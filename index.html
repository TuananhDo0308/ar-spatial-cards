<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WebAR - Camera Quét Thẻ AR Không Gian</title>
  <link rel="icon" href="data:,">

  <!-- A-Frame 1.5.0 & MindAR 1.2.5 -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Stylesheet Hệ thống (Shadcn Dark & VisionOS) -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Dữ liệu địa điểm fallback -->
  <script src="data/locations.js"></script>

  <!-- Logic vẽ Texture Canvas & Ứng dụng AR -->
  <script src="js/canvas-renderer.js"></script>
  <script src="js/ar-app.js"></script>
</head>
<body>

  <!-- Floating Toast nếu Safari cần user gesture để mở Camera -->
  <div class="camera-prompt-toast" id="camera-toast">
    <span>📷</span>
    <span>Chạm vào màn hình để mở Camera</span>
  </div>

  <!-- Minimalist Floating Overlay -->
  <div class="ui-layer">
    <!-- Top HUD Bar -->
    <div class="top-bar">
      <div class="status-badge">
        <div class="status-dot" id="status-dot"></div>
        <span class="status-text" id="status-text">Đang kết nối camera...</span>
      </div>
    </div>

    <!-- Center Reticle Laser -->
    <div class="scanning-reticle" id="reticle">
      <div class="reticle-corner tl"></div>
      <div class="reticle-corner tr"></div>
      <div class="reticle-corner bl"></div>
      <div class="reticle-corner br"></div>
      <div class="laser-scan"></div>
      <div class="reticle-hint">Hướng camera vào ảnh để quét</div>
    </div>

    <div></div>
  </div>

  <!-- Fullscreen Modal Phóng To (VisionOS Shared-Element Spring Curve) -->
  <div class="fullscreen-modal" id="fullscreen-modal">
    <div class="fullscreen-card" id="fullscreen-card">
      <button class="btn-close-modal" id="btn-close-modal" aria-label="Đóng">✕</button>
      <img src="assets/target-0.png" class="modal-hero-img" id="modal-img" alt="Địa điểm">

      <div class="modal-body">
        <div class="modal-content-animated">
          <div class="modal-top-meta">
            <span class="badge-pill badge-emerald" id="modal-badge">
              <span style="font-size:9px;">●</span> Di tích
            </span>
            <span style="font-size:0.85rem; color:#fbbf24; font-weight:700;" id="modal-rating">4.8 ★</span>
          </div>

          <h2 class="modal-title" id="modal-title">Dinh Độc Lập</h2>
          <div class="modal-city" id="modal-city">📍 TP. Hồ Chí Minh</div>

          <p class="modal-desc" id="modal-desc">
            Mô tả chi tiết địa điểm...
          </p>

          <div style="font-size:0.85rem; font-weight:700; color:#fff; margin-bottom:8px;">Điểm nổi bật:</div>
          <div id="modal-highlights"></div>

          <div class="meta-box">
            <div>⏰ <strong>Giờ mở cửa:</strong> <span id="modal-hours">08:00 - 16:30</span></div>
            <div>🎟️ <strong>Giá vé:</strong> <span id="modal-ticket">65.000 VNĐ</span></div>
          </div>

          <div style="margin-top: 20px;">
            <a class="btn btn-default" style="width: 100%;" id="btn-modal-map" target="_blank" rel="noopener noreferrer">
              <span>🗺️</span> <span>Chỉ Đường Google Maps</span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Offscreen Canvases (Render Textures cho Cụm Thẻ AR 3D: Thanh trên + 2 Card hai bên) -->
  <div style="display:none;">

    <canvas id="canvas-top-0" width="960" height="220"></canvas>
    <canvas id="canvas-left-0" width="520" height="760"></canvas>

      mindar-image="imageTargetSrc: ./assets/targets.mind?v=20261114_10all; maxTrack: 2; filterMinCF: 0.0005; filterBeta: 0.01; warmupTolerance: 4; missTolerance: 10; uiScanning: no; uiLoading: no; autoStart: false"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"

      <a-camera
        id="main-camera"
        position="0 0 0"
        look-controls="enabled: false"
        cursor="fuse: false; rayOrigin: mouse;"
        raycaster="near: 0.05; far: 50; interval: 60; objects: .clickable;"
      ></a-camera>
