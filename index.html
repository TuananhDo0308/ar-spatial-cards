<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WebAR - Camera Quét Thẻ AR Không Gian</title>
  <link rel="icon" href="data:,">

  <!-- A-Frame 1.5.0 & MindAR 1.2.5 -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Stylesheet Hệ thống (Shadcn Dark & VisionOS) -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Dữ liệu địa điểm fallback -->
  <script src="data/locations.js"></script>

  <!-- Logic vẽ Texture Canvas & Ứng dụng AR -->
  <script src="js/canvas-renderer.js"></script>
  <script src="js/ar-app.js"></script>
</head>
<body>

  <!-- Floating Toast nếu Safari cần user gesture để mở Camera -->
  <div class="camera-prompt-toast" id="camera-toast">
    <span>📷</span>
    <span>Chạm vào màn hình để mở Camera</span>
  </div>

  <!-- Camera View Hoàn Toàn Thuần Túy: Không khung ngắm, không text trên cùng -->
  <div class="ui-layer"></div>

  <!-- Fullscreen Modal Phóng To (VisionOS Shared-Element Spring Curve) -->
  <div class="fullscreen-modal" id="fullscreen-modal">
    <div class="fullscreen-card" id="fullscreen-card">
      <button class="btn-close-modal" id="btn-close-modal" aria-label="Đóng">✕</button>
      <img src="assets/target-0.png" class="modal-hero-img" id="modal-img" alt="Địa điểm">

      <div class="modal-body">
        <div class="modal-content-animated">
          <div class="modal-top-meta">
            <span class="badge-pill badge-emerald" id="modal-badge">
              <span style="font-size:9px;">●</span> Di tích
            </span>
            <span style="font-size:0.85rem; color:#fbbf24; font-weight:700;" id="modal-rating">4.8 ★</span>
          </div>

          <h2 class="modal-title" id="modal-title">Dinh Độc Lập</h2>
          <div class="modal-city" id="modal-city">📍 TP. Hồ Chí Minh</div>

          <p class="modal-desc" id="modal-desc">
            Mô tả chi tiết địa điểm...
          </p>

          <div style="font-size:0.85rem; font-weight:700; color:#fff; margin-bottom:8px;">Điểm nổi bật:</div>
          <div id="modal-highlights"></div>

          <div class="meta-box">
            <div>⏰ <strong>Giờ mở cửa:</strong> <span id="modal-hours">08:00 - 16:30</span></div>
            <div>🎟️ <strong>Giá vé:</strong> <span id="modal-ticket">65.000 VNĐ</span></div>
          </div>

          <div style="margin-top: 20px;">
            <a class="btn btn-default" style="width: 100%;" id="btn-modal-map" target="_blank" rel="noopener noreferrer">
              <span>🗺️</span> <span>Chỉ Đường Google Maps</span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Offscreen Canvases (Render Textures cho Cụm Thẻ AR 3D: Thanh trên + 2 Card hai bên) -->
  <div style="display:none;">
    <!-- Target 0: Dinh Độc Lập -->
    <canvas id="canvas-top-0" width="960" height="220"></canvas>
    <canvas id="canvas-left-0" width="520" height="760"></canvas>
    <canvas id="canvas-right-0" width="520" height="760"></canvas>
    <!-- Target 1: Phố Cổ Hội An -->
    <canvas id="canvas-top-1" width="960" height="220"></canvas>
    <canvas id="canvas-left-1" width="520" height="760"></canvas>
    <canvas id="canvas-right-1" width="520" height="760"></canvas>
    <!-- Target 2: Chợ Bến Thành -->
    <canvas id="canvas-top-2" width="960" height="220"></canvas>
    <canvas id="canvas-left-2" width="520" height="760"></canvas>
    <canvas id="canvas-right-2" width="520" height="760"></canvas>
    <!-- Target 3: Hồ Hoàn Kiếm -->
    <canvas id="canvas-top-3" width="960" height="220"></canvas>
    <canvas id="canvas-left-3" width="520" height="760"></canvas>
    <canvas id="canvas-right-3" width="520" height="760"></canvas>
    <!-- Target 4: Cầu Vàng Bà Nà -->
    <canvas id="canvas-top-4" width="960" height="220"></canvas>
    <canvas id="canvas-left-4" width="520" height="760"></canvas>
    <canvas id="canvas-right-4" width="520" height="760"></canvas>
    <!-- Target 5: Vịnh Hạ Long -->
    <canvas id="canvas-top-5" width="960" height="220"></canvas>
    <canvas id="canvas-left-5" width="520" height="760"></canvas>
    <canvas id="canvas-right-5" width="520" height="760"></canvas>
    <!-- Target 6: Đại Nội Huế -->
    <canvas id="canvas-top-6" width="960" height="220"></canvas>
    <canvas id="canvas-left-6" width="520" height="760"></canvas>
    <canvas id="canvas-right-6" width="520" height="760"></canvas>
    <!-- Target 7: Tràng An Ninh Bình -->
    <canvas id="canvas-top-7" width="960" height="220"></canvas>
    <canvas id="canvas-left-7" width="520" height="760"></canvas>
    <canvas id="canvas-right-7" width="520" height="760"></canvas>
    <!-- Target 8: Nhà Thờ Đức Bà -->
    <canvas id="canvas-top-8" width="960" height="220"></canvas>
    <canvas id="canvas-left-8" width="520" height="760"></canvas>
    <canvas id="canvas-right-8" width="520" height="760"></canvas>
    <!-- Target 9: Đảo Ngọc Phú Quốc -->
    <canvas id="canvas-top-9" width="960" height="220"></canvas>
    <canvas id="canvas-left-9" width="520" height="760"></canvas>
    <canvas id="canvas-right-9" width="520" height="760"></canvas>
  </div>

  <!-- AR Scene A-Frame (Zero-Parallax, bám chặt theo ảnh như Stories AR) -->
  <div class="ar-viewport">
    <a-scene
      mindar-image="imageTargetSrc: ./assets/targets.mind?v=20261115_clean; maxTrack: 2; filterMinCF: 0.001; filterBeta: 0.01; warmupTolerance: 2; missTolerance: 8; uiScanning: no; uiLoading: no; autoStart: false"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      embedded
    >
      <!-- Camera -->
      <a-camera
        id="main-camera"
        position="0 0 0"
        look-controls="enabled: false"
        cursor="fuse: false; rayOrigin: mouse;"
        raycaster="near: 0.05; far: 50; interval: 60; objects: .clickable;"
      ></a-camera>

      <!-- ================= TARGET 0: DINH ĐỘC LẬP (640x640 - Vuông 1.0) ================= -->
      <a-entity id="target-entity-0" mindar-image-target="targetIndex: 0">
        <a-plane id="target-frame-0" class="clickable" position="0 0 0.001" width="1.0" height="1.0" material="opacity: 0.001; transparent: true"></a-plane>
        <a-entity id="spatial-group-0" position="0 0 0.005" scale="0 0 0">
          <a-plane id="bar-top-0" class="clickable" src="#canvas-top-0" position="0 0.64 0.002" width="0.96" height="0.22" material="transparent: true; opacity: 0.98; alphaTest: 0.05; roughness: 0.25;"></a-plane>
          <a-plane id="card-left-0" class="clickable" src="#canvas-left-0" position="-0.75 0 0.002" rotation="0 4 0" width="0.44" height="0.64" material="transparent: true; opacity: 0.98; alphaTest: 0.05; roughness: 0.25;"></a-plane>
          <a-plane id="card-right-0" class="clickable" src="#canvas-right-0" position="0.75 0 0.002" rotation="0 -4 0" width="0.44" height="0.64" material="transparent: true; opacity: 0.98; alphaTest: 0.05; roughness: 0.25;"></a-plane>
        </a-entity>
      </a-entity>

      <!-- ================= TARGET 1: PHỐ CỔ HỘI AN (640x640 - Vuông 1.0) ================= -->
      <a-entity id="target-entity-1" mindar-image-target="targetIndex: 1">
        <a-plane id="target-frame-1" class="clickable" position="0 0 0.001" width="1.0" height="1.0" material="opacity: 0.001; transparent: true"></a-plane>
        <a-entity id="spatial-group-1" position="0 0 0.005" scale="0 0 0">
          <a-plane id="bar-top-1" class="clickable" src="#canvas-top-1" position="0 0.64 0.002" width="0.96" height="0.22" material="transparent: true; opacity: 0.98; alphaTest: 0.05; roughness: 0.25;"></a-plane>
          <a-plane id="card-left-1" class="clickable" src="#canvas-left-1" position="-0.75 0 0.002" rotation="0 4 0" width="0.44" height="0.64" material="transparent: true; opacity: 0.98; alphaTest: 0.05; roughness: 0.25;"></a-plane>
          <a-plane id="card-right-1" class="clickable" src="#canvas-right-1" position="0.75 0 0.002" rotation="0 -4 0" width="0.44" height="0.64" material="transparent: true; opacity: 0.98; alphaTest: 0.05; roughness: 0.25;"></a-plane>
        </a-entity>
      </a-entity>

      <!-- ================= TARGET 2: CHỢ BẾN THÀNH (800x534 - Ngang 0.667) ================= -->
      <a-entity id="target-entity-2" mindar-image-target="targetIndex: 2">

        <a-entity id="spatial-group-2" position="0 0 0.005" scale="0 0 0">

          <a-plane id="card-right-3" class="clickable" src="#canvas-right-3" position="0.75 0 0.002" rotation="0 -4 0" width="0.44" height="0.64" material="transparent: true; opacity: 0.98; alphaTest: 0.05; roughness: 0.25;"></a-plane>

          <a-plane id="card-left-4" class="clickable" src="#canvas-left-4" position="-0.75 0 0.002" rotation="0 4 0" width="0.44" height="0.64" material="transparent: true; opacity: 0.98; alphaTest: 0.05; roughness: 0.25;"></a-plane>
          <a-plane id="card-right-4" class="clickable" src="#canvas-right-4" position="0.75 0 0.002" rotation="0 -4 0" width="0.44" height="0.64" material="transparent: true; opacity: 0.98; alphaTest: 0.05; roughness: 0.25;"></a-plane>

          <a-plane id="card-left-5" class="clickable" src="#canvas-left-5" position="-0.75 0 0.002" rotation="0 4 0" width="0.44" height="0.64" material="transparent: true; opacity: 0.98; alphaTest: 0.05; roughness: 0.25;"></a-plane>
          <a-plane id="card-right-5" class="clickable" src="#canvas-right-5" position="0.75 0 0.002" rotation="0 -4 0" width="0.44" height="0.64" material="transparent: true; opacity: 0.98; alphaTest: 0.05; roughness: 0.25;"></a-plane>
        </a-entity>
      </a-entity>

      <!-- ================= TARGET 6: ĐẠI NỘI HUẾ (800x533 - Ngang 0.666) ================= -->
      <a-entity id="target-entity-6" mindar-image-target="targetIndex: 6">
        <a-plane id="target-frame-6" class="clickable" position="0 0 0.001" width="1.0" height="0.666" material="opacity: 0.001; transparent: true"></a-plane>
        <a-entity id="spatial-group-6" position="0 0 0.005" scale="0 0 0">

          <a-plane id="card-left-6" class="clickable" src="#canvas-left-6" position="-0.75 0 0.002" rotation="0 4 0" width="0.44" height="0.64" material="transparent: true; opacity: 0.98; alphaTest: 0.05; roughness: 0.25;"></a-plane>
          <a-plane id="card-right-6" class="clickable" src="#canvas-right-6" position="0.75 0 0.002" rotation="0 -4 0" width="0.44" height="0.64" material="transparent: true; opacity: 0.98; alphaTest: 0.05; roughness: 0.25;"></a-plane>
        </a-entity>
      </a-entity>

      <!-- ================= TARGET 7: TRÀNG AN NINH BÌNH (800x1200 - Dọc 1.500) ================= -->
      <a-entity id="target-entity-7" mindar-image-target="targetIndex: 7">
        <a-plane id="target-frame-7" class="clickable" position="0 0 0.001" width="1.0" height="1.500" material="opacity: 0.001; transparent: true"></a-plane>
        <a-entity id="spatial-group-7" position="0 0 0.005" scale="0 0 0">
          <a-plane id="bar-top-7" class="clickable" src="#canvas-top-7" position="0 0.89 0.002" width="0.96" height="0.22" material="transparent: true; opacity: 0.98; alphaTest: 0.05; roughness: 0.25;"></a-plane>
          <a-plane id="card-left-7" class="clickable" src="#canvas-left-7" position="-0.75 0 0.002" rotation="0 4 0" width="0.44" height="0.64" material="transparent: true; opacity: 0.98; alphaTest: 0.05; roughness: 0.25;"></a-plane>

</body>
</html>
