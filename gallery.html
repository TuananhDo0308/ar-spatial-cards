<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Thư Viện Ảnh Quét WebAR</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --card-bg: #09090b;
      --border: #27272a;
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --emerald: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    /* Floating Info Pill tinh tế ở góc trên giữa (Không chứa button nào) */
    .top-floating-hud {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 40;
      pointer-events: none;
    }

    .info-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(18, 18, 20, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 8px 18px;
      border-radius: 999px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
      transition: all 0.25s ease;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--emerald);
      box-shadow: 0 0 10px var(--emerald);
      flex-shrink: 0;
    }

    .pill-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }

    .pill-sub {
      font-size: 0.78rem;
      color: var(--text-muted);
      white-space: nowrap;
    }

    /* VÙNG CHỨA ẢNH FULL CHIẾM TOÀN BỘ MÀN HÌNH - CUỘN NGANG QUA LẠI */
    .gallery-slider {
      flex: 1;
      width: 100vw;
      height: calc(100vh - 100px);
      display: flex;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .gallery-slider::-webkit-scrollbar {
      display: none;
    }

    /* Mỗi slide chiếm trọn 100vw */
    .slide-item {
      flex: 0 0 100vw;
      width: 100vw;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      scroll-snap-align: center;
      scroll-snap-stop: always;
      padding: 68px 28px 24px 28px;
      box-sizing: border-box;
      user-select: none;
    }

    /* Khung ảnh Quang học AR tương phản cao để Camera điện thoại bắt dính siêu nhạy */
    .optical-image-box {
      position: relative;
      max-width: 92vw;
      max-height: calc(100vh - 190px);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 4px solid #000;
      box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.25), 0 24px 50px rgba(0, 0, 0, 0.8);
      background: #000;
      border-radius: 6px;
    }

    .optical-image-box img {
      max-width: 100%;
      max-height: calc(100vh - 198px);
      object-fit: contain;
      display: block;
      border-radius: 3px;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* 4 góc L-Bracket quang học AR tăng cường điểm đặc trưng góc cho camera AR */
    .ar-bracket {
      position: absolute;
      width: 24px;
      height: 24px;
      border-color: rgba(255, 255, 255, 0.9);
      border-style: solid;
      pointer-events: none;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.95);
      z-index: 2;
    }

    .ar-bracket.tl {
      top: -12px;
      left: -12px;
      border-width: 3.5px 0 0 3.5px;
      border-top-left-radius: 4px;
    }

    .ar-bracket.tr {
      top: -12px;
      right: -12px;
      border-width: 3.5px 3.5px 0 0;
      border-top-right-radius: 4px;
    }

    .ar-bracket.bl {
      bottom: -12px;
      left: -12px;
      border-width: 0 0 3.5px 3.5px;
      border-bottom-left-radius: 4px;
    }

    .ar-bracket.br {
      bottom: -12px;
      right: -12px;
      border-width: 0 3.5px 3.5px 0;
      border-bottom-right-radius: 4px;
    }

    /* DẢI PREVIEW LIST ẢNH BÊN DƯỚI CHÂN MÀN HÌNH */
    .bottom-preview-dock {
      width: 100vw;
      height: 96px;
      background: rgba(9, 9, 11, 0.92);
      border-top: 1px solid var(--border);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      z-index: 40;
    }

    .preview-track {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 8px 10px;
      max-width: 1100px;
      width: 100%;
      align-items: center;
      scroll-behavior: smooth;
    }

    .preview-track::-webkit-scrollbar {
      display: none;
    }

    /* Mỗi item trong dải preview */
    .preview-item {
      flex: 0 0 82px;
      height: 64px;
      border-radius: 10px;
      background: #18181b;
      border: 2px solid var(--border);
      overflow: hidden;
      cursor: pointer;
      position: relative;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      flex-shrink: 0;
    }

    .preview-item:hover {
      border-color: #52525b;
      transform: translateY(-2px);
    }

    .preview-item.active {
      border-color: var(--emerald);
      box-shadow: 0 0 16px rgba(16, 185, 129, 0.5);
      transform: scale(1.06);
    }

    .preview-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .preview-tag {
      position: absolute;
      bottom: 2px;
      right: 2px;
      background: rgba(0, 0, 0, 0.82);
      font-size: 0.65rem;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 4px;
      color: #e4e4e7;
    }

    @media (max-width: 640px) {
      .bottom-preview-dock {
        height: 84px;
      }
      .preview-item {
        flex: 0 0 70px;
        height: 54px;
      }
      .optical-image-box {
        max-width: 96vw;
      }
      .slide-item {
        padding: 58px 12px 18px 12px;
      }
    }
  </style>
</head>
<body>

  <!-- Floating Minimal HUD: Chỉ hiển thị tên ảnh đang ngắm, hoàn toàn không có button -->
  <div class="top-floating-hud">
    <div class="info-pill">
      <span class="status-dot"></span>
      <span class="pill-title" id="pill-title">Target #0 • Dinh Độc Lập</span>
      <span class="pill-sub" id="pill-sub">📍 TP. Hồ Chí Minh</span>
    </div>
  </div>

  <!-- VÙNG ẢNH FULL VIEWPORT: CUỘN QUA LẠI BẰNG CHUỘT / TOUCH / PHÍM MŨI TÊN -->
  <div class="gallery-slider" id="slider"></div>

  <!-- DẢI PREVIEW LIST ẢNH BÊN DƯỚI -->
  <div class="bottom-preview-dock">
    <div class="preview-track" id="preview-track"></div>
  </div>

  <script>
    // Dữ liệu 10 mục tiêu chuẩn xác 100% khớp với targets.mind
    const TARGETS = [
      { id: 0, name: "Phố Cổ Hội An", city: "Quảng Nam", src: "assets/card-hoian.jpg" },
      { id: 1, name: "Dinh Độc Lập", city: "TP. Hồ Chí Minh", src: "assets/card-dinhdoclap.jpg" },
      { id: 2, name: "Chợ Bến Thành", city: "TP. Hồ Chí Minh", src: "assets/card-benthanh.jpg" },
      { id: 3, name: "Hồ Hoàn Kiếm & Tháp Rùa", city: "Hà Nội", src: "assets/card-hanoi.jpg" },
      { id: 4, name: "Vịnh Hạ Long", city: "Quảng Ninh", src: "assets/card-halong.jpg" }
    ];

    let currentIndex = 0;
    let isClickScrolling = false;
    let scrollTimeout = null;

    const slider = document.getElementById('slider');
    const previewTrack = document.getElementById('preview-track');
    const pillTitle = document.getElementById('pill-title');
    const pillSub = document.getElementById('pill-sub');

    // 1. Tạo các Slide ảnh Full với Khung Định Vị Quang Học AR
    function renderSlides() {
      slider.innerHTML = '';
      TARGETS.forEach((item, idx) => {
        const slide = document.createElement('div');
        slide.className = 'slide-item';
        slide.id = `slide-${idx}`;
        slide.innerHTML = `
          <div class="optical-image-box">
            <img src="${item.src}" alt="${item.name}">
            <div class="ar-bracket tl"></div>
            <div class="ar-bracket tr"></div>
            <div class="ar-bracket bl"></div>
            <div class="ar-bracket br"></div>
          </div>
        `;
        slider.appendChild(slide);
      });
    }

    // 2. Tạo Preview List ảnh bên dưới
    function renderPreviewList() {
      previewTrack.innerHTML = '';
      TARGETS.forEach((item, idx) => {
        const thumb = document.createElement('div');
        thumb.className = `preview-item ${idx === currentIndex ? 'active' : ''}`;
        thumb.id = `thumb-${idx}`;
        thumb.onclick = () => selectIndex(idx);
        thumb.innerHTML = `
          <img src="${item.src}" alt="${item.name}">
          <span class="preview-tag">#${item.id}</span>
        `;
        previewTrack.appendChild(thumb);
      });
    }

    // 3. Cập nhật trạng thái hiển thị
    function updateHUD(idx) {
      currentIndex = idx;
      const t = TARGETS[currentIndex];
      if (t) {
        pillTitle.textContent = `Target #${t.id} • ${t.name}`;
        pillSub.textContent = `📍 ${t.city}`;
      }

      // Highlight thumbnail tương ứng
      const thumbs = previewTrack.querySelectorAll('.preview-item');
      thumbs.forEach((th, i) => {
        th.classList.toggle('active', i === currentIndex);
      });

      // Cuộn thumbnail active vào giữa dải preview
      const activeThumb = document.getElementById(`thumb-${currentIndex}`);
      if (activeThumb) {
        activeThumb.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
      }
    }

    // 4. Chọn ảnh khi click vào thumbnail
    function selectIndex(idx) {
      if (idx < 0) idx = 0;
      if (idx >= TARGETS.length) idx = TARGETS.length - 1;
      currentIndex = idx;
      updateHUD(idx);

      const targetSlide = document.getElementById(`slide-${idx}`);
      if (targetSlide) {
        isClickScrolling = true;
        targetSlide.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        setTimeout(() => {
          isClickScrolling = false;
        }, 450);
      }
    }

    // 5. Lắng nghe sự kiện cuộn qua lại trên Slider
    slider.addEventListener('scroll', () => {
      if (isClickScrolling) return;
      clearTimeout(scrollTimeout);
      scrollTimeout = setTimeout(() => {
        const itemWidth = slider.clientWidth;
        if (itemWidth > 0) {
          const newIdx = Math.round(slider.scrollLeft / itemWidth);
          if (newIdx !== currentIndex && newIdx >= 0 && newIdx < TARGETS.length) {
            updateHUD(newIdx);
          }
        }
      }, 40);
    }, { passive: true });

    // 6. Chuyển đổi con lăn chuột dọc thành cuộn ngang tự nhiên trên Desktop
    slider.addEventListener('wheel', (e) => {
      if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
        slider.scrollLeft += e.deltaY;
        e.preventDefault();
      }
    }, { passive: false });

    // 7. Lắng nghe phím mũi tên trái / phải trên bàn phím
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') {
        selectIndex((currentIndex + 1) % TARGETS.length);
      } else if (e.key === 'ArrowLeft') {
        selectIndex((currentIndex - 1 + TARGETS.length) % TARGETS.length);
      }
    });

    // Khởi tạo
    renderSlides();
    renderPreviewList();
    updateHUD(0);
  </script>
</body>
</html>
